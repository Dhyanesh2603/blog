<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Contact — Siddarth Santosh</title>
  <meta name="description" content="Get in touch with Siddarth Santosh regarding field notes, projects, or inquiries.">
  
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Production Stylesheets -->
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  
  <!-- Client Scripts (Deferred) -->
  <script src="../assets/js/main.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page">
    <header class="siteheader">
      <nav class="sitenav" aria-label="Primary Navigation">
        <a href="../index.html" class="name">Siddarth Santosh</a>
        <div class="links">
          <a href="../index.html">Home</a>
          <a href="../blog/index.html">Blog</a>
          <a href="../about/index.html">About</a>
          <a href="index.html" class="active" aria-current="page">Contact</a>
        </div>
      </nav>
    </header>

    <main id="main-content" class="main-content">
      <section class="contact" aria-labelledby="contact-heading">
        <p class="eyebrow">Contact</p>
        <h1 id="contact-heading">Get in touch</h1>
        <p class="sub">Questions about a post, the project, or just to say hi.</p>
        
        <form id="contact-form" name="contact" method="POST" action="#" data-netlify="true" netlify-honeypot="bot-field" novalidate>
          <!-- Netlify Forms Identifier -->
          <input type="hidden" name="form-name" value="contact">
          
          <!-- Anti-spam Honeypot -->
          <div class="visually-hidden" aria-hidden="true">
            <label for="bot-field">Leave this field blank:</label>
            <input name="bot-field" id="bot-field" tabindex="-1" autocomplete="off">
          </div>

          <div class="form-field">
            <label for="contact-name" class="visually-hidden">Your name</label>
            <input type="text" id="contact-name" name="name" placeholder="Your name" required autocomplete="name">
          </div>

          <div class="form-field">
            <label for="contact-email" class="visually-hidden">Your email</label>
            <input type="email" id="contact-email" name="email" placeholder="name@email.com" required autocomplete="email">
          </div>

          <div class="form-field">
            <label for="contact-message" class="visually-hidden">Your message</label>
            <textarea rows="4" id="contact-message" name="message" placeholder="Your message" required></textarea>
          </div>

          <button type="submit">Send message</button>

          <!-- Accessible Live Notification Box -->
          <div id="form-status" class="form-status hidden" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <footer class="sitefoot">
      <div class="foot-links">
        <a href="../index.html">Home</a>
        <a href="../blog/index.html">Blog</a>
        <a href="../about/index.html">About</a>
        <a href="index.html">Contact</a>
      </div>
      <span>Siddarth Santosh</span>
    </footer>
  </div>
</body>
</html>
